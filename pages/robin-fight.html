<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROBINCITY Clean Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/game/robin-fight.css?v=robincity-clean-black">
</head>
<body>
  <main class="game-shell">
    <section class="game-stage" aria-label="ROBINCITY Clean Up game">
      <div class="game-topbar">
        <nav class="site-nav" aria-label="Site navigation">
          <a href="../index.html">Home</a>
          <a href="whitepaper.html">Whitepaper</a>
          <a href="treasury.html">Treasury Tracker</a>
          <a href="legal.html">Legal Bureau</a>
          <a aria-current="page" href="robin-fight.html">RC Minigame</a>
        </nav>
        <div class="hud" aria-live="polite">
          <span id="scoreText">Score 0</span>
          <span id="waveText">Wave 1</span>
          <span class="health-meter" aria-label="Hero health">
            <span id="healthText">HP 100</span>
            <span class="health-track"><span id="healthFill"></span></span>
          </span>
          <button class="music-toggle" id="musicToggle" type="button" aria-pressed="false">Music Off</button>
        </div>
      </div>

      <div class="canvas-wrap">
        <canvas id="gameCanvas" width="1280" height="720"></canvas>
        <div class="start-panel" id="startPanel">
          <h1>ROBINCITY Clean Up</h1>
          <form id="playerForm">
            <label for="playerName">Username</label>
            <div class="start-row">
              <input id="playerName" name="playerName" maxlength="18" autocomplete="nickname" placeholder="winner name" required>
              <button type="submit">Start</button>
            </div>
          </form>
          <p>PC: arrows/WASD to move, J punch, K kick, Shift/L guard. Phone: drag left side to move; tap, swipe up, or hold right side to fight.</p>
        </div>
      </div>

      <aside class="scoreboard" aria-label="Local scoreboard">
        <div>
          <h2 id="scoreboardTitle">Local Winners</h2>
          <p class="scoreboard-status" id="scoreboardStatus">Local scores active</p>
          <ol id="scoreList"></ol>
        </div>
        <button id="resetScores" type="button">Clear Local Scores</button>
      </aside>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/game/robin-fight-config.js?v=robincity-gestures-v1"></script>
  <script src="../assets/game/robin-fight.js?v=black-gold-neon-arrows-v1"></script>
</body>
</html>
