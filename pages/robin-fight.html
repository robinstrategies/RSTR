<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robinman Alley Fight</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/game/robin-fight.css">
</head>
<body>
  <main class="game-shell">
    <section class="game-stage" aria-label="Robinman Alley Fight game">
      <div class="game-topbar">
        <a class="brand-link" href="../index.html">Robin Strategies</a>
        <div class="hud" aria-live="polite">
          <span id="scoreText">Score 0</span>
          <span id="waveText">Wave 1</span>
          <span class="health-meter" aria-label="Hero health">
            <span id="healthText">HP 100</span>
            <span class="health-track"><span id="healthFill"></span></span>
          </span>
        </div>
      </div>

      <div class="canvas-wrap">
        <canvas id="gameCanvas" width="1280" height="720"></canvas>
        <div class="start-panel" id="startPanel">
          <h1>Robinman Alley Fight</h1>
          <form id="playerForm">
            <label for="playerName">Username</label>
            <div class="start-row">
              <input id="playerName" name="playerName" maxlength="18" autocomplete="nickname" placeholder="winner name" required>
              <button type="submit">Start</button>
            </div>
          </form>
          <p>Move with arrows or WASD. Punch with J. Kick with K. Hold Shift or L to defend.</p>
        </div>
      </div>

      <aside class="scoreboard" aria-label="Local scoreboard">
        <div>
          <h2>Local Winners</h2>
          <ol id="scoreList"></ol>
        </div>
        <button id="resetScores" type="button">Clear Scores</button>
      </aside>
    </section>
  </main>
  <script src="../assets/game/robin-fight.js"></script>
</body>
</html>
